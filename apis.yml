aid: connectrn
name: ConnectRN
description: 'connectRN is a Waltham, Massachusetts based per-diem (PRN) healthcare
  staffing marketplace that connects nurses, CNAs and allied clinicians with open shifts
  at hospitals, home health and hospice agencies, and skilled nursing facilities across
  the United States. Clinicians browse and claim shifts through the connectRN mobile
  app with no minimum commitment, no required weekends or holidays, and same-day pay;
  facilities post shifts, auto-backfill open coverage and approve timesheets through
  a web platform at app.connectrn.com. In April 2026 connectRN merged with SnapCare,
  combining connectRN''s PRN clinician community with SnapCare''s Booker workforce
  technology platform. connectRN operates a public status page but publishes no public
  developer program, API documentation, or machine-readable API contract; its API host
  api.connectrn.com serves the first-party mobile and web applications only.'
